<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}原價屋管理介面{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="preload" href="/static/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/static/js/theme.js"></script>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="/">原價屋</a>
    <nav class="site-nav">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>抓取狀態</a>
      <a href="/products" {% if request.url.path.startswith("/products") %}aria-current="page"{% endif %}>商品</a>
      <a href="/similarity-hints" {% if request.url.path.startswith("/similarity-hints") %}aria-current="page"{% endif %}>合併建議</a>
      <a href="/merge" {% if request.url.path.startswith("/merge") %}aria-current="page"{% endif %}>手動合併</a>
    </nav>
    <div class="site-header__end">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="切換主題">☾</button>
    </div>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
