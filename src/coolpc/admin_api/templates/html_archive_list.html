{% extends "base.html" %}
{% block title %}原始 HTML 封存 - 原價屋管理介面{% endblock %}
{% block content %}
<h1>原始 HTML 封存</h1>
<table>
  <thead><tr><th>估價時間</th><th>類型</th><th>狀態</th><th>檔案路徑</th></tr></thead>
  <tbody>
    {% for s in snapshots %}
    <tr>
      <td><a href="/html-archive/{{ s.id }}">{{ s.fetched_at.strftime("%Y-%m-%d %H:%M") }}</a></td>
      <td>{{ s.scrape_type }}</td>
      <td>{{ s.status }}</td>
      <td>{{ s.raw_html_path }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
