<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}原價屋歷史價格查詢{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/public.css">
  <link rel="preload" href="/static/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 主題必須在畫面繪製前決定，否則深色使用者會先看到一閃的亮色頁面 -->
  <script src="/static/js/theme.js"></script>
</head>
<body{% block body_attrs %}{% endblock %}>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="/">原價屋歷史價格</a>
    <nav class="site-nav">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>搜尋</a>
      <a href="/compare" id="compareNavLink" {% if request.url.path == "/compare" %}aria-current="page"{% endif %}>比較</a>
    </nav>
    <div class="site-header__end">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="切換主題">☾</button>
    </div>
  </div>
</header>
<script>
window.coolpcCompare = {
  _key: 'coolpc_compare_ids',
  _read() {
    try {
      const raw = localStorage.getItem(this._key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  },
  _write(ids) {
    try { localStorage.setItem(this._key, JSON.stringify(ids)); } catch (e) {}
  },
  has(id) { return this._read().includes(id); },
  add(id) {
    // 比較清單最多 5 個商品（/compare 頁本身要求 2 到 5 個），沒有這個上限的話
    // localStorage 裡的清單可能無止盡累積，導致 /compare 永遠 hard-error。
    const ids = this._read();
    if (!ids.includes(id)) {
      if (ids.length >= 5) {
        alert('比較清單最多 5 個商品，請先移除一些再加入新的。');
        return false;
      }
      ids.push(id);
      this._write(ids);
    }
    this._updateNav();
    return true;
  },
  remove(id) {
    const ids = this._read().filter(x => x !== id);
    this._write(ids);
    this._updateNav();
  },
  clear() {
    this._write([]);
    this._updateNav();
  },
  _updateNav() {
    const link = document.getElementById('compareNavLink');
    if (!link) return;
    const ids = this._read();
    link.textContent = ids.length ? `比較 ${ids.length}` : '比較';
    link.href = ids.length ? `/compare?ids=${ids.join(',')}` : '/compare';
  },
};
window.coolpcCompare._updateNav();
</script>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
