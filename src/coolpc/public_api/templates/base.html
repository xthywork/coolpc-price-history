<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}原價屋歷史價格查詢{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "微軟正黑體", sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
    header { background: #1f2937; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
    th { background: #f1f5f9; }
    .up { color: #b91c1c; }
    .down { color: #15803d; }
    .inactive { color: #9ca3af; }
    form.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; background: #fff; padding: 12px; border-radius: 6px; }
    form.filters input, form.filters select { padding: 6px; }
    .pagination { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
    a { color: #2563eb; }
  </style>
</head>
<body>
<header>
  <a href="/">商品搜尋</a>
  <a href="/compare" id="compareNavLink">商品比較</a>
</header>
<script>
window.coolpcCompare = {
  _key: 'coolpc_compare_ids',
  _read() {
    try {
      const raw = localStorage.getItem(this._key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  },
  _write(ids) {
    try { localStorage.setItem(this._key, JSON.stringify(ids)); } catch (e) {}
  },
  has(id) { return this._read().includes(id); },
  add(id) {
    const ids = this._read();
    if (!ids.includes(id)) { ids.push(id); this._write(ids); }
    this._updateNav();
  },
  remove(id) {
    const ids = this._read().filter(x => x !== id);
    this._write(ids);
    this._updateNav();
  },
  _updateNav() {
    const link = document.getElementById('compareNavLink');
    if (!link) return;
    const ids = this._read();
    link.textContent = ids.length ? `商品比較 (${ids.length})` : '商品比較';
    link.href = ids.length ? `/compare?ids=${ids.join(',')}` : '/compare';
  },
};
window.coolpcCompare._updateNav();
</script>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
